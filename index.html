<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ЁДОК — Доставка еды</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --orange: #FF5A00;
            --orange-hover: #E04F00;
            --dark: #121212;
            --dark-card: #1E1E1E;
            --dark-header: #0A0A0A;
            --border: #2C2C2C;
            --text-main: #FFFFFF;
            --text-muted: #9E9E9E;
            --max-color: #8B5CF6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* --- ШАПКА --- */
        .top-bar {
            background: var(--dark-header);
            border-bottom: 1px solid var(--border);
            padding: 8px 20px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar a { color: var(--text-muted); text-decoration: none; }
        .top-bar a:hover { color: var(--orange); }

        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background: rgba(18, 18, 18, 0.98);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-box { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--orange); }
        .logo-fallback { width: 44px; height: 44px; border-radius: 50%; background: var(--dark); border: 2px solid var(--orange); display: none; justify-content: center; align-items: center; color: var(--orange); font-weight: 900; font-size: 11px; }
        
        .brand { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; }
        .brand span { color: var(--orange); }

        .header-right { display: flex; align-items: center; gap: 20px; }

        .header-phone {
            color: #fff; text-decoration: none; font-weight: 700; font-size: 15px;
            display: flex; align-items: center; gap: 8px;
        }
        .header-phone:hover { color: var(--orange); }

        .mobile-cart-btn {
            display: none; background: var(--orange); color: #000; border: none;
            padding: 10px 18px; border-radius: 30px; font-weight: 800; font-size: 14px;
            cursor: pointer; align-items: center; gap: 8px;
        }

        /* --- КАТЕГОРИИ --- */
        .categories-bar {
            position: fixed;
            top: 68px; left: 0; width: 100%;
            background: var(--dark);
            border-bottom: 1px solid var(--border);
            z-index: 99;
            overflow-x: auto; white-space: nowrap;
            padding: 10px 20px; scrollbar-width: none;
        }
        .categories-bar::-webkit-scrollbar { display: none; }
        
        .cat-chip {
            display: inline-block; padding: 8px 18px; margin-right: 8px;
            border-radius: 20px; background: var(--dark-card); border: 1px solid var(--border);
            color: var(--text-muted); font-size: 13px; font-weight: 600;
            cursor: pointer; transition: 0.2s;
        }
        .cat-chip.active { background: var(--orange); color: #000; border-color: var(--orange); }
        .cat-chip:hover { border-color: var(--orange); }

        /* --- ЗАГОЛОВКИ СЕКЦИЙ --- */
        .section-title {
            font-size: 20px; font-weight: 800; color: #fff;
            margin: 30px 0 15px 0; padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .section-title:first-child { margin-top: 0; }

        /* --- МАКЕТ --- */
        .main-layout {
            max-width: 1400px; margin: 0 auto;
            padding: 130px 20px 40px;
            display: grid; grid-template-columns: 1fr 380px;
            gap: 30px; align-items: start;
        }

        /* --- СЕТКА ТОВАРОВ --- */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px; align-items: stretch;
        }

        .product-card {
            background: var(--dark-card); border-radius: 16px;
            overflow: hidden; cursor: pointer; transition: 0.2s;
            border: 1px solid transparent; display: flex; flex-direction: column;
        }
        .product-card:hover { border-color: var(--orange); transform: translateY(-3px); }
        .product-card:active { transform: scale(0.98); }

        .product-image {
            width: 100%; height: 160px; background: #2A2A2A;
            display: flex; align-items: center; justify-content: center;
            color: #555; font-size: 12px; flex-shrink: 0;
        }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }

        .product-body { padding: 16px; display: flex; flex-direction: column; flex: 1; }

        .product-name {
            font-weight: 800; font-size: 15px; line-height: 1.3; margin-bottom: 6px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .product-desc-short {
            font-size: 12px; color: var(--text-muted); line-height: 1.4; margin-bottom: 12px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .product-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: auto; padding-top: 10px;
        }

        .product-price { font-weight: 900; font-size: 18px; color: var(--orange); }

        .add-btn {
            background: var(--dark); color: #fff; border: 1px solid var(--border);
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 22px; cursor: pointer; transition: 0.2s;
        }
        .add-btn:hover { background: var(--orange); border-color: var(--orange); color: #000; }

        /* --- КОРЗИНА --- */
        .sidebar-cart {
            background: var(--dark-card); border-radius: 20px; padding: 24px;
            position: sticky; top: 130px; max-height: calc(100vh - 160px);
            display: flex; flex-direction: column; border: 1px solid var(--border);
        }

        .sidebar-title {
            font-size: 18px; font-weight: 900; margin-bottom: 16px;
            padding-bottom: 12px; border-bottom: 1px solid var(--border);
        }

        .cart-items-scroll { overflow-y: auto; flex: 1; padding-right: 5px; margin-bottom: 16px; }
        .cart-items-scroll::-webkit-scrollbar { width: 4px; }
        .cart-items-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px dashed var(--border);
        }
        .cart-item:last-child { border-bottom: none; }
        
        .cart-item-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
        .cart-item-price { color: var(--orange); font-weight: 800; font-size: 13px; }

        .qty-controls {
            display: flex; align-items: center; gap: 8px;
            background: var(--dark); padding: 3px; border-radius: 20px;
        }
        .qty-btn {
            background: var(--border); border: none; color: #fff;
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 14px; cursor: pointer; transition: 0.2s;
        }
        .qty-btn:hover { background: var(--orange); color: #000; }

        .sidebar-footer { border-top: 1px solid var(--border); padding-top: 16px; }

        .summary-row {
            display: flex; justify-content: space-between;
            font-size: 18px; font-weight: 900; margin-bottom: 16px;
        }
        .summary-row span:last-child { color: var(--orange); }

        .checkout-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .checkout-form input {
            background: var(--dark); border: 1px solid var(--border);
            color: #fff; padding: 12px; border-radius: 10px;
            font-family: 'Montserrat', sans-serif; font-size: 13px;
        }
        .checkout-form input:focus { outline: none; border-color: var(--orange); }

        .checkout-btn {
            background: var(--max-color); color: #fff; border: none;
            padding: 14px; border-radius: 12px; font-weight: 900; font-size: 14px;
            text-transform: uppercase; cursor: pointer; width: 100%; transition: 0.2s;
        }
        .checkout-btn:hover { background: #7C3AED; }

        .empty-state { color: var(--text-muted); font-size: 13px; text-align: center; padding: 30px 0; }

        /* --- МОДАЛЬНОЕ ОКНО --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
            z-index: 1000; display: none; justify-content: center; align-items: flex-end;
        }
        @media (min-width: 769px) { .modal-overlay { align-items: center; } }

        .bottom-sheet {
            background: var(--dark-card); width: 100%; max-width: 500px;
            border-radius: 24px; padding: 28px; position: relative;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .close-btn {
            position: absolute; top: 12px; right: 12px;
            background: var(--dark); border: none; width: 34px; height: 34px;
            border-radius: 50%; color: var(--text-muted); font-size: 16px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            z-index: 10;
        }
        .close-btn:hover { color: #fff; }

        .modal-image {
            width: 100%; height: 220px; background: #2A2A2A;
            border-radius: 12px; margin-bottom: 16px;
            display: flex; align-items: center; justify-content: center; color: #555;
            overflow: hidden;
        }
        .modal-image img { width: 100%; height: 100%; object-fit: cover; }

        .modal-title { font-size: 22px; font-weight: 900; margin-bottom: 10px; }
        .modal-desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; }
        
        .modal-footer { display: flex; align-items: center; gap: 16px; }
        .modal-price { font-size: 24px; font-weight: 900; color: var(--orange); flex: 1; }
        .add-to-cart-btn {
            background: var(--orange); color: #000; border: none;
            padding: 14px 28px; border-radius: 12px;
            font-weight: 900; font-size: 14px; text-transform: uppercase;
            cursor: pointer; transition: 0.2s;
        }
        .add-to-cart-btn:hover { background: var(--orange-hover); }

        /* --- АДАПТИВ --- */
        @media (max-width: 1024px) { .main-layout { grid-template-columns: 1fr 320px; gap: 20px; } }
        @media (max-width: 900px) { .header-phone { display: none; } }

        @media (max-width: 768px) {
            .top-bar { display: none; }
            header { top: 0; }
            .categories-bar { top: 68px; }
            .main-layout { display: block; padding: 130px 15px 40px; }
            .mobile-cart-btn { display: flex; }
            
            .sidebar-cart {
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                max-height: 100vh; border-radius: 0; border: none; z-index: 2000;
                transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .sidebar-cart.active { transform: translateY(0); }
            
            .close-cart-mobile { display: block; margin-bottom: 12px; text-align: right; }
            .close-cart-mobile button { background: none; border: none; color: #fff; font-size: 24px; }
            
            .menu-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .product-image { height: 120px; }
            .product-body { padding: 12px; }
            .product-name { font-size: 13px; }
            .product-desc-short { display: none; }
            .product-price { font-size: 16px; }
            .add-btn { width: 32px; height: 32px; font-size: 18px; }
        }
        
        @media (min-width: 769px) {
            .close-cart-mobile { display: none; }
            .mobile-cart-btn { display: none; }
        }
        @media (max-width: 400px) {
            .menu-grid { grid-template-columns: 1fr; }
            .product-image { height: 160px; }
            .product-desc-short { display: -webkit-box; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>📍 Город: <strong>Москва</strong></span>
        <span>📞 <a href="tel:+79999999999">+7 (999) 999-99-99</a></span>
    </div>

    <header>
        <div class="header-inner">
            <div class="logo-box">
                <!-- СЮДА ВСТАВЬ СВОЁ ФОТО -->
                <img src="logo.png" alt="ЁДОК" class="logo-img" onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='flex';">
                <div id="fallbackLogo" class="logo-fallback">ЁДОК</div>
                <div class="brand">ЁДОК<span>.</span></div>
            </div>
            
            <div class="header-right">
                <a href="tel:+79999999999" class="header-phone">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--orange)"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    +7 (999) 999-99-99
                </a>
                
                <button class="mobile-cart-btn" onclick="toggleMobileCart()">
                    🛒 <span id="mobileCartCount">0</span> ₽
                </button>
            </div>
        </div>
    </header>

    <div class="categories-bar">
        <span class="cat-chip active" onclick="filterCategory('all', this)">Основное</span>
        <span class="cat-chip" onclick="filterCategory('ГИРО И РОЛЛЫ', this)">Гиро</span>
        <span class="cat-chip" onclick="filterCategory('ЗАКУСКИ И ФРИ', this)">Закуски</span>
        <span class="cat-chip" onclick="filterCategory('БОКСЫ И САЛАТЫ', this)">Салаты</span>
    </div>

    <div class="main-layout">
        <div class="menu-section">
            <div id="menu-container"></div>
        </div>

        <div class="sidebar-cart" id="sidebarCart">
            <div class="close-cart-mobile">
                <button onclick="toggleMobileCart()">✕</button>
            </div>

            <div class="sidebar-title">Ваш заказ</div>
            
            <div class="cart-items-scroll" id="cartItemsList"></div>

            <div class="sidebar-footer" id="cartSummary" style="display: none;">
                <div class="summary-row">
                    <span>Итого:</span>
                    <span id="totalPrice">0 ₽</span>
                </div>
                <div class="checkout-form">
                    <input type="text" id="customerName" placeholder="Ваше имя">
                    <input type="text" id="customerAddress" placeholder="Адрес доставки">
                </div>
                <button class="checkout-btn" onclick="checkout()">Оформить заказ в MAX</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="productModal" onclick="closeModal(event)">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div class="modal-image" id="modalImage">
                <span>Фото блюда</span>
            </div>
            <div class="modal-title" id="modalName">Название</div>
            <div class="modal-desc" id="modalDesc">Состав</div>
            <div class="modal-footer">
                <div class="modal-price" id="modalPrice">0 ₽</div>
                <button class="add-to-cart-btn" id="modalAddBtn">Добавить</button>
            </div>
        </div>
    </div>

    <script>
        const menuData = [
            {
                category: "ГИРО И РОЛЛЫ",
                items: [
                    { id: 1, name: "ГИРО ОТ ШЕФА", desc: "Пита, помидоры, куриное филе, картофель фри, сыр сулугуни, халапеньо, свежий лук, зелень, фирменный соус", price: 430, image: "product1.jpg" },
                    { id: 2, name: "ТОРТИЛЬЯ ОТ ШЕФА", desc: "Тортилья, помидоры, куриное филе, картофель фри, сыр сулугуни, халапеньо, свежий лук, зелень, фирменный соус", price: 430, image: "product2.jpg" },
                    { id: 3, name: "ГИРО", desc: "Пита, помидоры, куриное филе, картофель фри, соус", price: 330, image: "product3.jpg" },
                    { id: 4, name: "ГИРО В ТОРТИЛЬЕ", desc: "Тортилья, помидоры, куриное филе, картофель фри, соус", price: 330, image: "product4.jpg" },
                    { id: 5, name: "ГИРО НА ТАРЕЛКЕ", desc: "Пита, куриное филе, помидоры, свежий огурец, халапеньо, свежий лук, картофель фри, два фирменных соуса", price: 430, image: "product5.jpg" },
                    { id: 6, name: "ГИРО С КРЕВЕТКАМИ", desc: "Пита, креветки, помидоры, шпинат, свежие огурцы, сулугуни, картофель фри, соус", price: 460, image: "product6.jpg" },
                    { id: 7, name: "ГИРО СТЕЙК", desc: "Пита, 4 куриных наггетса, пекинская капуста, помидоры, соус", price: 290, image: "product7.jpg" },
                    { id: 8, name: "ГИРО ОВОЩНОЙ", desc: "Пита, помидоры, свежий огурец, пекинская капуста, картофель фри, соус", price: 280, image: "product8.jpg" },
                    { id: 9, name: "СЛАДКИЙ ГИРО", desc: "Пита, овощной плов, банан", price: 230, image: "product9.jpg" },
                    { id: 10, name: "ЦЕЗАРЬ РОЛЛ", desc: "Тортилья, 4 куриных наггетса, листья айсберга, помидоры, плавленый сыр, соус", price: 300, image: "product10.jpg" },
                    { id: 11, name: "ЦЕЗАРЬ РОЛЛ С КРЕВЕТКАМИ", desc: "Тортилья, креветки, плавленый сыр, помидоры, свежий огурец, шпинат, соус", price: 340, image: "product11.jpg" },
                    { id: 12, name: "ПИТА В СЫРОМ СУЛУГУНИ", desc: "Пита, сыр сулугуни", price: 200, image: "product12.jpg" }
                ]
            },
            {
                category: "ЗАКУСКИ И ФРИ",
                items: [
                    { id: 13, name: "ФРИ (150г)", desc: "Хрустящий картофель фри", price: 190, image: "product13.jpg" },
                    { id: 14, name: "ФРИ ОТ ШЕФА (150г)", desc: "Картофель фри с фирменными специями", price: 200, image: "product14.jpg" },
                    { id: 15, name: "КАРТОФЕЛЬ ПО-ДЕРЕВЕНСКИ (170г)", desc: "Картофель с пряными травами", price: 200, image: "product15.jpg" },
                    { id: 16, name: "НАГГЕТСЫ (7ШТ) С ФРИ (150ГР)", desc: "Куриные наггетсы и картофель фри", price: 390, image: "product16.jpg" },
                    { id: 17, name: "НАГГЕТСЫ (7ШТ)", desc: "Куриные наггетсы", price: 300, image: "product17.jpg" },
                    { id: 18, name: "СЫРНЫЕ ПОДУШКИ (7ШТ)", desc: "Хрустящие сырные подушечки", price: 300, image: "product18.jpg" },
                    { id: 19, name: "КРЕВЕТКИ (7/9/11 ШТ)", desc: "Обжаренные креветки в панировке", price: 380, image: "product19.jpg" }
                ]
            },
            {
                category: "БОКСЫ И САЛАТЫ",
                items: [
                    { id: 20, name: "ШЕФ БОКС", desc: "Фри от Шефа, наггетсы, сыр сулугуни, халапеньо, зелень, соус на выбор", price: 430, image: "product20.jpg" },
                    { id: 21, name: "ОВОЩНОЙ САЛАТ", desc: "Томаты, свежий огурец, пекинская капуста, заправка - оливковое масло", price: 220, image: "product21.jpg" },
                    { id: 22, name: "ЦЕЗАРЬ САЛАТ", desc: "Пекин, куриное филе, сухари кукурузные, микс салатов, заправка на чесночном соусе, сыр Сулугуни", price: 300, image: "product22.jpg" }
                ]
            }
        ];

        let cart = JSON.parse(localStorage.getItem('edok_cart')) || [];
        let currentProduct = null;

        function renderMenu(filter = 'all') {
            const container = document.getElementById('menu-container');
            let html = '';

            menuData.forEach(cat => {
                if (filter !== 'all' && cat.category !== filter) return;
                
                if (filter === 'all') {
                    html += `<div class="section-title">${cat.category}</div>`;
                }
                
                html += `<div class="menu-grid">`;
                cat.items.forEach(item => {
                    html += `
                        <div class="product-card" onclick="openModal(${item.id})">
                            <div class="product-image">
                                <img src="${item.image}" alt="${item.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Фото блюда</span>';">
                            </div>
                            <div class="product-body">
                                <div class="product-name">${item.name}</div>
                                <div class="product-desc-short">${item.desc || ''}</div>
                                <div class="product-footer">
                                    <div class="product-price">${item.price} ₽</div>
                                    <div class="add-btn">+</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        function filterCategory(category, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            renderMenu(category);
        }

        function openModal(id) {
            let product = null;
            menuData.forEach(cat => {
                const found = cat.items.find(i => i.id === id);
                if (found) product = found;
            });
            if (!product) return;
            currentProduct = product;
            
            document.getElementById('modalName').innerText = product.name;
            document.getElementById('modalDesc').innerText = product.desc || "Описание отсутствует.";
            document.getElementById('modalPrice').innerText = product.price + " ₽";
            
            const modalImg = document.getElementById('modalImage');
            modalImg.innerHTML = `<img src="${product.image}" alt="${product.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Фото блюда</span>';">`;
            
            document.getElementById('productModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal(e) {
            if (e && e.target !== document.getElementById('productModal') && e.type === 'click' && e.target.className !== 'close-btn') return;
            document.getElementById('productModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        document.getElementById('modalAddBtn').addEventListener('click', () => {
            if (currentProduct) {
                addToCart(currentProduct.id, currentProduct.name, currentProduct.price);
                closeModal();
            }
        });

        function addToCart(id, name, price) {
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id, name, price, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            localStorage.setItem('edok_cart', JSON.stringify(cart));
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('mobileCartCount').innerText = total;

            const list = document.getElementById('cartItemsList');
            const summary = document.getElementById('cartSummary');

            if (cart.length === 0) {
                list.innerHTML = `<div class="empty-state">Ваша корзина пока пуста.<br>Добавьте что-нибудь вкусное!</div>`;
                summary.style.display = 'none';
                return;
            }

            list.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div>
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">${item.price} ₽</div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                        <span style="font-weight:800; width:14px; text-align:center;">${item.quantity}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('totalPrice').innerText = total + ' ₽';
            summary.style.display = 'block';
        }

        function changeQty(id, delta) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) cart = cart.filter(i => i.id !== id);
                updateCartUI();
            }
        }

        function toggleMobileCart() {
            const sidebar = document.getElementById('sidebarCart');
            sidebar.classList.toggle('active');
            document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : 'auto';
        }

        function checkout() {
    const name = document.getElementById('customerName').value.trim();
    const address = document.getElementById('customerAddress').value.trim();

    if (!name || !address) {
        alert("Пожалуйста, заполните имя и адрес доставки.");
        return;
    }

    const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    
    let message = `🔥 *НОВЫЙ ЗАКАЗ* 🔥\n\n`;
    message += `👤 *Клиент:* ${name}\n`;
    message += `📍 *Адрес:* ${address}\n\n`;
    message += `🛒 *Состав заказа:*\n`;
    cart.forEach(item => {
        message += `▪ ${item.name} x${item.quantity} = ${item.price * item.quantity} ₽\n`;
    });
    message += `\n💰 *ИТОГО К ОПЛАТЕ:* ${total} ₽`;

    // 1. Копируем текст в буфер обмена
    navigator.clipboard.writeText(message).then(() => {
        // 2. Показываем подсказку
        alert("Текст заказа скопирован! Сейчас откроется чат в MAX. Просто вставьте текст и отправьте.");
        
        // 3. Открываем твой профиль в MAX
        // ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ИЗ MAX (например, https://max.ru/u/xxxxx)
        window.open("https://max.ru/u/f9LHodD0cOJr3MG7RVWrLvLFaqTAvKBghiTMNx2MlJxPb638XPWiVppUeQk", "_blank");
    }).catch(err => {
        alert("Не удалось скопировать текст. Пожалуйста, выделите и скопируйте заказ вручную.");
        console.error("Ошибка копирования: ", err);
    });
}

        renderMenu();
        updateCartUI();
    </script>
</body>
